<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Virtual Wardrobe</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #24204a 0%,
            #111321 45%,
            #090b12 100%
        );

    color: white;

    min-height: 100vh;

    padding: 20px;

}


.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

}


/* =========================
   HEADER
========================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 25px;

}


.logo {

    display: flex;

    align-items: center;

    gap: 12px;

}


.logo-icon {

    width: 55px;

    height: 55px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    border-radius: 15px;

    font-size: 28px;

}


.logo h1 {

    font-size: 25px;

}


.logo p {

    color: #9297aa;

    font-size: 13px;

    margin-top: 3px;

}


/* =========================
   STATS
========================= */

.player-stats {

    display: flex;

    gap: 10px;

}


.stat {

    background:
        rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 12px;

    padding: 10px 15px;

    text-align: center;

    min-width: 90px;

}


.stat span {

    display: block;

    color: #85899b;

    font-size: 10px;

    text-transform: uppercase;

}


.stat strong {

    font-size: 18px;

}


/* =========================
   TOOLBAR
========================= */

.toolbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;

}


.filters {

    display: flex;

    gap: 7px;

    overflow-x: auto;

}


.filter {

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.04);

    color: #aaaec0;

    padding: 9px 15px;

    border-radius: 10px;

    cursor: pointer;

    white-space: nowrap;

}


.filter.active {

    background: #6366f1;

    color: white;

}


.refresh {

    border: none;

    background: #181b2b;

    color: white;

    padding: 10px 15px;

    border-radius: 10px;

    cursor: pointer;

}


/* =========================
   WARDROBE GRID
========================= */

.wardrobe {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(210px, 1fr)
        );

    gap: 18px;

}


/* =========================
   ITEM CARD
========================= */

.item {

    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(35,38,58,.95),
            rgba(20,22,34,.95)
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 18px;

    padding: 15px;

    overflow: hidden;

    transition: .2s;

}


.item:hover {

    transform:
        translateY(-4px);

    border-color:
        rgba(129,140,248,.5);

}


/* =========================
   ITEM VISUAL
========================= */

.item-visual {

    height: 170px;

    border-radius: 13px;

    background:
        radial-gradient(
            circle at center,
            #343955,
            #181b29
        );

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    margin-bottom: 13px;

}


.item-icon {

    font-size: 70px;

}


.status {

    position: absolute;

    top: 10px;

    right: 10px;

    padding: 5px 8px;

    border-radius: 7px;

    font-size: 9px;

    font-weight: bold;

}


.status.wearing {

    background:
        rgba(34,197,94,.15);

    color:
        #4ade80;

}


.status.unworn {

    background:
        rgba(148,163,184,.12);

    color:
        #aeb7c7;

}


/* =========================
   INFORMATION
========================= */

.item-type {

    color:
        #818cf8;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 4px;

}


.item-name {

    font-size: 17px;

    font-weight: 700;

    margin-bottom: 10px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.price {

    color:
        #facc15;

    font-weight: bold;

    margin-bottom: 12px;

}


/* =========================
   ACTIONS
========================= */

.actions {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;

}


.action-btn {

    border: none;

    padding: 9px 5px;

    border-radius: 8px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

}


.equip-btn {

    background:
        rgba(99,102,241,.15);

    color:
        #a5b4fc;

    border:
        1px solid
        rgba(99,102,241,.3);

}


.delete-btn {

    background:
        rgba(239,68,68,.12);

    color:
        #f87171;

    border:
        1px solid
        rgba(239,68,68,.25);

}


.delete-btn:hover {

    background:
        rgba(239,68,68,.25);

}


/* =========================
   LOADING
========================= */

.loading {

    grid-column:
        1 / -1;

    text-align: center;

    padding: 70px;

    color: #85899b;

}


.loader {

    width: 40px;

    height: 40px;

    border:
        4px solid
        rgba(255,255,255,.1);

    border-top-color:
        #818cf8;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;

    margin:
        0 auto 15px;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   ERROR / EMPTY
========================= */

.error,
.empty {

    grid-column:
        1 / -1;

    text-align: center;

    padding: 60px;

}


.error {

    color:
        #f87171;

}


.empty {

    color:
        #777d91;

}


/* =========================
   MOBILE
========================= */

@media(max-width:650px) {

    body {

        padding: 12px;

    }


    .header {

        flex-direction: column;

        align-items: flex-start;

    }


    .player-stats {

        width: 100%;

    }


    .stat {

        flex: 1;

    }


    .toolbar {

        flex-direction: column;

        align-items: stretch;

    }


    .refresh {

        width: 100%;

    }


    .wardrobe {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }


    .item {

        padding: 10px;

    }


    .item-visual {

        height: 130px;

    }


    .item-icon {

        font-size: 55px;

    }


    .item-name {

        font-size: 14px;

    }

}


@media(max-width:380px) {

    .wardrobe {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            👕
        </div>

        <div>

            <h1>
                Virtual Wardrobe
            </h1>

            <p>
                Character Inventory
            </p>

        </div>

    </div>


    <div class="player-stats">

        <div class="stat">

            <span>
                Items
            </span>

            <strong id="totalItems">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Wearing
            </span>

            <strong id="wearingItems">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Value
            </span>

            <strong id="totalValue">
                ₹0
            </strong>

        </div>

    </div>

</header>


<!-- TOOLBAR -->

<div class="toolbar">

    <div class="filters">

        <button
            class="filter active"
            onclick="filterItems('ALL', this)"
        >
            ALL
        </button>

        <button
            class="filter"
            onclick="filterItems('WEARING', this)"
        >
            🟢 WEARING
        </button>

        <button
            class="filter"
            onclick="filterItems('UN WORN', this)"
        >
            ⚪ UN WORN
        </button>

    </div>


    <button
        class="refresh"
        onclick="loadOutfits()"
    >
        🔄 Refresh
    </button>

</div>


<!-- WARDROBE -->

<div
    id="wardrobe"
    class="wardrobe"
>

    <div class="loading">

        <div class="loader"></div>

        Loading wardrobe...

    </div>

</div>


</div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
    "https://letbackend.onrender.com/api/wardobe/";


let outfits = [];

let currentFilter = "ALL";


/* =====================================================
   ICONS
===================================================== */

const TYPE_ICONS = {

    TOP: "👕",

    BOTTOM: "👖",

    SHOES: "👟",

    HEAD: "🧢",

    ACCESSORY: "🕶️",

    JACKET: "🧥",

    DRESS: "👗",

    DEFAULT: "🎽"

};


/* =====================================================
   GET OUTFITS
===================================================== */

async function loadOutfits() {

    const wardrobe =
        document.getElementById(
            "wardrobe"
        );


    wardrobe.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            Loading wardrobe...

        </div>

    `;


    try {

        const response =
            await fetch(
                `${API_URL}clothing-items`
            );


        if (!response.ok) {

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const result =
            await response.json();


        outfits =
            Array.isArray(result)
            ? result
            : result.data || [];


        updateStats();

        renderOutfits();

    }


    catch (error) {

        console.error(error);


        wardrobe.innerHTML = `

            <div class="error">

                ❌ Failed to load wardrobe

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderOutfits() {

    const wardrobe =
        document.getElementById(
            "wardrobe"
        );


    let filtered =
        outfits;


    if (
        currentFilter !== "ALL"
    ) {

        filtered =
            outfits.filter(
                item =>
                    normalizeStatus(
                        item.status
                    ) ===
                    currentFilter
            );

    }


    if (
        filtered.length === 0
    ) {

        wardrobe.innerHTML = `

            <div class="empty">

                🎒 No clothing items found

            </div>

        `;

        return;

    }


    wardrobe.innerHTML =
        filtered
            .map(
                createItemCard
            )
            .join("");

}


/* =====================================================
   CREATE ITEM CARD
===================================================== */

function createItemCard(item) {

    const name =
        item.name ||
        "Unknown Item";


    const type =
        item.type ||
        "OTHER";


    const price =
        Number(
            item.price || 0
        );


    const status =
        normalizeStatus(
            item.status
        );


    const icon =
        TYPE_ICONS[
            type.toUpperCase()
        ] ||
        TYPE_ICONS.DEFAULT;


    const isWearing =
        status === "WEARING";


    return `

        <div
            class="item"
            id="item-${item.id}"
        >

            <div class="item-visual">

                <div class="item-icon">
                    ${icon}
                </div>


                <div
                    class="status ${
                        isWearing
                        ? "wearing"
                        : "unworn"
                    }"
                >

                    ${
                        isWearing
                        ? "🟢 WEARING"
                        : "⚪ UN WORN"
                    }

                </div>

            </div>


            <div class="item-type">

                ${escapeHTML(
                    type.toUpperCase()
                )}

            </div>


            <div class="item-name">

                ${escapeHTML(name)}

            </div>


            <div class="price">

                🪙 ₹${price.toLocaleString(
                    "en-IN"
                )}

            </div>


            <div class="actions">

                <button
                    class="action-btn equip-btn"
                    onclick="toggleWearing(${item.id})"
                >
                    ${
                        isWearing
                        ? "UNEQUIP"
                        : "EQUIP"
                    }
                </button>

            </div>

        </div>

    `;

}



/* =====================================================
   EQUIP / UNEQUIP
===================================================== */

/*
This requires a PUT/PATCH endpoint on your backend.

For now this function changes the UI locally.
*/
async function toggleWearing(id) {

    const item =
        outfits.find(
            item => item.id === id
        );


    if (!item) return;


    // If already wearing, just make it unworn locally
    if (
        normalizeStatus(item.status)
        === "WEARING"
    ) {

        item.status = "UN WORN";

        updateStats();

        renderOutfits();

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}${id}/wear`,
                {
                    method: "POST"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to wear clothing"
            );

        }


        // Replace local item with server data

        const index =
            outfits.findIndex(
                item => item.id === id
            );


        if (index !== -1) {

            outfits[index] =
                result.data;

        }


        updateStats();

        renderOutfits();


    }
    catch (error) {

        console.error(error);

        alert(
            "❌ " +
            error.message
        );

    }

}


/* =====================================================
   FILTER
===================================================== */

function filterItems(
    filter,
    button
) {

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    renderOutfits();

}


/* =====================================================
   STATS
===================================================== */

function updateStats() {

    const total =
        outfits.length;


    const wearing =
        outfits.filter(
            item =>
                normalizeStatus(
                    item.status
                ) === "WEARING"
        ).length;


    const value =
        outfits.reduce(
            (sum, item) =>
                sum +
                Number(
                    item.price || 0
                ),
            0
        );


    document.getElementById(
        "totalItems"
    ).textContent =
        total;


    document.getElementById(
        "wearingItems"
    ).textContent =
        wearing;


    document.getElementById(
        "totalValue"
    ).textContent =
        "₹" +
        value.toLocaleString(
            "en-IN"
        );

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(status) {

    if (!status) {

        return "UN WORN";

    }


    return String(status)
        .trim()
        .toUpperCase();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return String(value)
        .replace(
            /'/g,
            "\\'"
        );

}


/* =====================================================
   START
===================================================== */

loadOutfits();

</script>

</body>

</html>
