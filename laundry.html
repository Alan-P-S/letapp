<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Laundry Inventory</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #172033 0%, #080b12 45%, #05070b 100%);
    color: #ffffff;
    min-height: 100vh;
}

/* ================= HEADER ================= */

.header {
    padding: 25px 20px;
    border-bottom: 1px solid #263044;
    background: rgba(7, 10, 16, 0.9);
    backdrop-filter: blur(10px);
}

.header-inner {
    max-width: 1200px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;
    background: #182235;
    border: 1px solid #34425d;

    font-size: 24px;
}

.logo h1 {
    font-size: 20px;
    letter-spacing: 1px;
}

.logo p {
    color: #78849a;
    font-size: 12px;
    margin-top: 3px;
}

/* ================= STATS ================= */

.stats {
    max-width: 1200px;
    margin: 25px auto;

    padding: 0 20px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat {
    background: rgba(15, 21, 33, 0.85);

    border: 1px solid #29344a;
    border-radius: 14px;

    padding: 18px;
}

.stat-label {
    color: #758199;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;

    margin-top: 7px;
}

/* ================= MAIN ================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px 40px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.section-title h2 {
    font-size: 20px;
}

.section-title span {
    color: #758199;
    font-size: 13px;
}

/* ================= GRID ================= */

.laundry-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));

    gap: 18px;
}

/* ================= CARD ================= */

.card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(25, 34, 51, 0.95),
            rgba(10, 14, 22, 0.98)
        );

    border: 1px solid #303d55;
    border-radius: 18px;

    padding: 20px;

    overflow: hidden;

    transition:
        transform 0.2s,
        border-color 0.2s,
        box-shadow 0.2s;
}

.card:hover {
    transform: translateY(-4px);

    border-color: #657a9e;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.4);
}

/* priority glow */

.card.high-priority {
    border-color: #8d5c39;

    box-shadow:
        0 0 25px rgba(255, 150, 70, 0.08);
}

.priority {
    position: absolute;

    top: 12px;
    right: 12px;

    font-size: 10px;

    padding: 5px 8px;

    border-radius: 6px;

    background: #302016;
    color: #ffb978;

    border: 1px solid #63432b;

    text-transform: uppercase;
}

/* ================= ITEM ICON ================= */

.item-icon {
    width: 58px;
    height: 58px;

    border-radius: 15px;

    background: #182235;
    border: 1px solid #34425d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    margin-bottom: 16px;
}

.item-name {
    font-size: 18px;
    font-weight: bold;

    margin-bottom: 5px;
}

.item-type {
    color: #7f8ca3;

    font-size: 12px;

    text-transform: uppercase;
}

/* ================= WEAR COUNT ================= */

.wear-box {
    margin-top: 18px;

    padding: 14px;

    background: #0b1019;

    border: 1px solid #253047;

    border-radius: 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}


.delete-btn {

    background:
        rgba(239,68,68,.12);

    color:
        #f87171;

    border:
        1px solid
        rgba(239,68,68,.25);

}


.delete-btn:hover {

    background:
        rgba(239,68,68,.25);

}


.action-btn {

    border: none;

    padding: 10px 10px;

    border-radius: 8px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

}



.wear-label {
    color: #77839a;
    font-size: 11px;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.wear-count {
    font-size: 25px;
    font-weight: bold;

    color: #ffbd75;
}

.wear-times {
    color: #7d899d;
    font-size: 11px;
}

/* ================= BUTTON ================= */

.reset-btn {
    width: 100%;

    margin-top: 14px;

    padding: 12px;

    border-radius: 10px;

    border: 1px solid #6b3939;

    background: #281517;

    color: #ff8585;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.reset-btn:hover {
    background: #4a2020;

    border-color: #a84c4c;
}

.reset-btn:active {
    transform: scale(0.97);
}

.reset-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* ================= EMPTY ================= */

.empty {
    text-align: center;

    padding: 70px 20px;

    color: #657188;
}

.empty-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.empty h3 {
    color: #aab4c7;
    margin-bottom: 8px;
}

.empty p {
    font-size: 13px;
}

/* ================= LOADING ================= */

.loading {
    text-align: center;

    padding: 60px;

    color: #7f8ba0;
}

.loader {
    width: 35px;
    height: 35px;

    border: 3px solid #273247;
    border-top-color: #8b9bb7;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;

    margin: auto auto 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ================= TOAST ================= */

.toast {
    position: fixed;

    bottom: 25px;
    right: 25px;

    padding: 14px 18px;

    background: #151d2b;

    border: 1px solid #36445d;

    border-radius: 10px;

    color: #dbe3f1;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.4);

    transform: translateY(100px);

    opacity: 0;

    transition: 0.3s;

    z-index: 1000;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .header {
        padding: 20px 15px;
    }

    .header-inner {
        align-items: flex-start;
    }

    .stats {
        padding: 0 15px;

        grid-template-columns:
            repeat(2, 1fr);

        margin-top: 20px;
    }

    .stat:last-child {
        grid-column: span 2;
    }

    .container {
        padding: 0 15px 30px;
    }

    .laundry-grid {
        grid-template-columns: 1fr;
    }

    .logo h1 {
        font-size: 17px;
    }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-inner">

        <div class="logo">

            <div class="logo-icon">
                🧺
            </div>
            <div class="logo-icon">
            <a style="text-decoration: none;" href="wardrobe.html">👕</a>
        </div>

            <div>
                <h1>LAUNDRY</h1>
                <p>OVERUSED GEAR STORAGE</p>
            </div>

        </div>

    </div>

</header>


<!-- ================= STATS ================= -->

<div class="stats">

    <div class="stat">

        <div class="stat-label">
            Laundry Items
        </div>

        <div
            class="stat-value"
            id="itemCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Total Wears
        </div>

        <div
            class="stat-value"
            id="totalWears"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Highest Worn
        </div>

        <div
            class="stat-value"
            id="highestWorn"
        >
            0
        </div>

    </div>

</div>


<!-- ================= CONTENT ================= -->

<main class="container">

    <div class="section-title">

        <h2>
            🧺 Laundry Queue
        </h2>

        <span id="resultText">
            Loading...
        </span>

    </div>


    <div id="loading" class="loading">

        <div class="loader"></div>

        Loading laundry...

    </div>


    <div
        id="laundryGrid"
        class="laundry-grid"
        style="display:none;"
    ></div>


    <div
        id="empty"
        class="empty"
        style="display:none;"
    >

        <div class="empty-icon">
            ✨
        </div>

        <h3>
            Laundry is clear!
        </h3>

        <p>
            No clothing has been worn more than once.
        </p>

    </div>

</main>


<div
    id="toast"
    class="toast"
></div>


<script>

const API_URL =
    "https://letbackend.onrender.com/api/wardobe";

const laundryGrid =
    document.getElementById("laundryGrid");

const loading =
    document.getElementById("loading");

const empty =
    document.getElementById("empty");

const itemCount =
    document.getElementById("itemCount");

const totalWears =
    document.getElementById("totalWears");

const highestWorn =
    document.getElementById("highestWorn");

const resultText =
    document.getElementById("resultText");


// ===============================
// TYPE ICONS
// ===============================

const typeIcons = {

    TOP: "👕",

    BOTTOM: "👖",

    SHOES: "👟",

    HEAD: "🧢",

    ACCESSORY: "🕶️",

    JACKET: "🧥",

    DRESS: "👗"

};


// ===============================
// NORMALIZE TYPE
// ===============================

function normalizeType(type) {

    return String(type || "")
        .trim()
        .toUpperCase();

}


// ===============================
// LOAD CLOTHES
// ===============================

async function loadLaundry() {

    try {

        loading.style.display = "block";

        laundryGrid.style.display = "none";

        empty.style.display = "none";


        const response =
            await fetch(`${API_URL}/clothing-items`);


        if (!response.ok) {

            throw new Error(
                "Failed to fetch clothing"
            );

        }


        const result =
            await response.json();


        let clothes =
            result.data || [];


        // ONLY ITEMS WORN MORE THAN ONCE

        clothes =
            clothes.filter(item =>
                Number(item.wornCount || 0) > 0
            );


        // MOST WORN FIRST

        clothes.sort(
            (a, b) =>
                Number(b.wornCount || 0)
                -
                Number(a.wornCount || 0)
        );


        loading.style.display = "none";


        if (clothes.length === 0) {

            empty.style.display = "block";

            updateStats([]);

            resultText.textContent =
                "0 items";

            return;
        }


        laundryGrid.style.display =
            "grid";


        renderLaundry(clothes);

        updateStats(clothes);


        resultText.textContent =
            `${clothes.length} items`;

    }

    catch (error) {

        console.error(error);

        loading.style.display =
            "none";

        empty.style.display =
            "block";

        empty.innerHTML = `
            <div class="empty-icon">⚠️</div>

            <h3>
                Failed to load laundry
            </h3>

            <p>
                Make sure your backend is running.
            </p>
        `;

    }

}


// ===============================
// RENDER
// ===============================

function renderLaundry(clothes) {

    laundryGrid.innerHTML = "";


    clothes.forEach(
        (item, index) => {

            const card =
                createLaundryCard(
                    item,
                    index
                );

            laundryGrid.appendChild(card);

        }
    );

}


// ===============================
// CREATE CARD
// ===============================

function createLaundryCard(item, index) {

    const card =
        document.createElement("div");


    const count =
        Number(item.wornCount || 0);


    const type =
        normalizeType(item.type);


    const icon =
        typeIcons[type] || "🎽";


    card.className =
        "card";


    // Extra highlight for heavily worn items

    if (count >= 5) {

        card.classList.add(
            "high-priority"
        );

    }


    card.innerHTML = `

        ${
            index === 0
            ?
            `<div class="priority">
                #1 MOST WORN
            </div>`
            :
            ""
        }


        <div class="item-icon">
            ${icon}
        </div>


        <div class="item-name">
            ${escapeHTML(item.name)}
        </div>


        <div class="item-type">
            ${escapeHTML(type)}
        </div>


        <div class="wear-box">

            <div>

                <div class="wear-label">
                    Worn
                </div>

                <div class="wear-count">
                    ${count}
                </div>

            </div>


            <div class="wear-times">
                TIMES
            </div>

        </div>


        <button
            class="reset-btn"
            onclick="resetCount(${item.id}, '${escapeJS(item.name)}', this)"
        >
            ↻ RESET COUNT
        </button><br><br>
        <button
                    class="action-btn delete-btn"
                    onclick="deleteItem(${item.id}, '${escapeJS(item.name)}')"
                >
                    🗑 DELETE
                </button>



    `;


    return card;

}



async function deleteItem(
    id,
    name
) {

    const confirmed =
        confirm(
            `Delete "${name}" from your wardrobe?`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/clothing-item/${id}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Server returned ${response.status}`
            );

        }

        await loadLaundry();


    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Failed to delete item\n\n" +
            error.message
        );

    }

}


// ===============================
// RESET COUNT
// ===============================
async function resetCount(id, name, button) {

    const confirmed =
        confirm(`Reset worn count for "${name}"?`);

    if (!confirmed) {
        return;
    }

    try {

        button.disabled = true;
        button.textContent = "RESETTING...";

        const response = await fetch(
            `${API_URL}/${id}/reset-worn-count`,
            {
                method: "PATCH"
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message ||
                "Failed to reset count"
            );
        }

        showToast(`✓ ${name} count reset`);

        await loadLaundry();

    } catch (error) {

        console.error(error);

        button.disabled = false;
        button.textContent = "↻ RESET COUNT";

        showToast("❌ Failed to reset count");
    }
}


// ===============================
// STATS
// ===============================

function updateStats(clothes) {

    const total =
        clothes.reduce(
            (sum, item) =>
                sum +
                Number(item.wornCount || 0),
            0
        );


    const highest =
        clothes.length
        ?
        Math.max(
            ...clothes.map(
                item =>
                    Number(
                        item.wornCount || 0
                    )
            )
        )
        :
        0;


    itemCount.textContent =
        clothes.length;


    totalWears.textContent =
        total;


    highestWorn.textContent =
        highest;

}


// ===============================
// ESCAPE HTML
// ===============================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char])
        );

}


// ===============================
// ESCAPE JS
// ===============================

function escapeJS(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");

}


// ===============================
// TOAST
// ===============================

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2500);

}


// ===============================
// START
// ===============================

loadLaundry();

</script>

</body>
</html>
