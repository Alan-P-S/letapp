
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Leaderboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    radial-gradient(circle at top,
    #1e293b,
    #0f172a 65%);
    min-height:100vh;
    padding:30px;
    color:white;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.title{
    font-size:34px;
    font-weight:700;
}

.back-btn{
    border:none;
    background:
    linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
    );
    color:white;
    padding:12px 22px;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    transition:.25s;
}

.back-btn:hover{
    transform:translateY(-2px);
}

.podium{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
    margin-bottom:30px;
}

.podium-card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:30px;
    text-align:center;
    transition:.3s;
}

.podium-card:hover{
    transform:translateY(-5px);
}

.first{
    background:
    linear-gradient(
    135deg,
    rgba(245,158,11,.25),
    rgba(217,119,6,.15)
    );
    transform:scale(1.05);
}

.rank{
    font-size:50px;
    margin-bottom:12px;
}

.name{
    font-size:22px;
    font-weight:700;
    margin-bottom:10px;
}

.score{
    color:#60a5fa;
    font-size:28px;
    font-weight:700;
}

.search-box{
    width:100%;
    padding:16px;
    border:none;
    outline:none;
    border-radius:16px;
    margin-bottom:20px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,.08);
    color:white;
    font-size:15px;
}

.search-box::placeholder{
    color:#94a3b8;
}

.table-card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    overflow:hidden;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:rgba(37,99,235,.35);
    color:white;
    padding:18px;
    text-align:left;
    font-weight:600;
}

td{
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

tr{
    transition:.2s;
}

tr:hover{
    background:rgba(255,255,255,.04);
}

.rank-badge{
    background:rgba(59,130,246,.15);
    color:#60a5fa;
    padding:6px 14px;
    border-radius:999px;
    font-weight:700;
}

.loading{
    text-align:center;
    font-size:24px;
    margin-top:120px;
    color:#cbd5e1;
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    .header{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }

    .podium{
        grid-template-columns:1fr;
    }

    .first{
        transform:none;
    }

    .title{
        font-size:28px;
    }

    th,
    td{
        padding:12px;
        font-size:14px;
    }

}
</style>
</head>
<body>

<div id="loading" class="loading">
Loading Leaderboard...
</div>

<div id="content" style="display:none;">

<div class="header">

<div class="title">
🏆 Leaderboard
</div>

<button class="back-btn" onclick="location.href='home.html'">
Dashboard
</button>

</div>

<div class="podium" id="podium"></div>

<input
type="text"
id="search"
class="search-box"
placeholder="Search user...">

<div class="table-card">

<table>

<thead>
<tr>
<th>Rank</th>
<th>User</th>
<th>Points</th>
<th>Attempts</th>
</tr>
</thead>

<tbody id="leaderboardBody"></tbody>

</table>

</div>

</div>

<script>

// Protected Page
const token = localStorage.getItem("token");

if(!token){
    window.location.href = "index.html";
}

// Dummy Data
let users = [];

const API_URL ="http://localhost:3000/api";

async function loadLeaderboard(){

    try{

        const response =
        await fetch(
            API_URL + "/leaderboard",
            {
                headers:{
                    Authorization:
                    "Bearer " + token
                }
            }
        );

        if(!response.ok){

            throw new Error(
                "Failed to fetch leaderboard"
            );

        }

        
        users =
        await response.json();
        
        renderLeaderboard(users);

        document.getElementById(
            "loading"
        ).style.display = "none";

        document.getElementById(
            "content"
        ).style.display = "block";

    }catch(err){

        console.error(err);

        document.getElementById(
            "loading"
        ).innerHTML =
        "Failed to load leaderboard";

    }

}

function renderLeaderboard(data){
   
    // renderPodium(data);

    const tbody =
    document.getElementById("leaderboardBody");

    tbody.innerHTML = "";

    data.forEach((user,index)=>{

        tbody.innerHTML += `
        <tr>
            <td>
                <span class="rank-badge">
                    #${index+1}
                </span>
            </td>
            <td>${user.username}</td>
            <td>${user.points}</td>
            <td>${user.attemptedCount}</td>
        </tr>
        `;

    });

}

function renderPodium(data){

    const top3 = data.slice(0,3);

    document.getElementById("podium").innerHTML = `

        <div class="podium-card">
            <div class="rank">🥈</div>
            <div class="name">${top3[1].username}</div>
            <div class="score">${top3[1].points}</div>
        </div>

        <div class="podium-card first">
            <div class="rank">🥇</div>
            <div class="name">${top3[0].username}</div>
            <div class="score">${top3[0].points}</div>
        </div>

        <div class="podium-card">
            <div class="rank">🥉</div>
            <div class="name">${top3[2].username}</div>
            <div class="score">${top3[2].points}</div>
        </div>

    `;
}

document
.getElementById("search")
.addEventListener("input",e=>{

    const term =
    e.target.value.toLowerCase();

    const filtered =
    users.filter(user=>
        user.username
        .toLowerCase()
        .includes(term)
    );

    renderLeaderboard(filtered);

});

loadLeaderboard();

</script>

</body>
</html>
