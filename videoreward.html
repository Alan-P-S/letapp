<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Library</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.grid{
    width:95%;
    margin:auto;
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.thumbnail{
    width:100%;
    height:180px;
    object-fit:cover;

    filter:blur(30px);
    transition:.4s;
}

.card:hover .thumbnail{
    filter:blur(0);
}

.content{
    padding:15px;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.cost{
    color:#22c55e;
    font-weight:bold;
}

.message{
    text-align:center;
    margin:20px;
    color:#f87171;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.9);
    z-index:9999;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-content{
    width:90%;
    max-width:1000px;
}

.modal video{
    width:100%;
    border-radius:12px;
    background:black;
}

.close{
    color:white;
    font-size:40px;
    cursor:pointer;
    float:right;
    margin-bottom:10px;
}

.close:hover{
    color:#f87171;
}

.loading{
    text-align:center;
    padding:30px;
    color:#94a3b8;
}

</style>

</head>
<body>

<header>
🎬 Video Platform
</header>

<div id="message" class="message"></div>

<div id="videoGrid" class="grid">
    <div class="loading">
        Loading videos...
    </div>
</div>

<!-- Video Modal -->

<div id="videoModal" class="modal">

    <div class="modal-content">

        <span class="close"
        onclick="closePlayer()">
        &times;
        </span>

        <video
        id="player"
        controls
        autoplay>
        </video>

    </div>

</div>
    <div class="card">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/TQUfuMY3AWg?si=L6ajZmQadUNrvarU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
<script>
const token = localStorage.getItem("token");

if(!token){ window.location.href = "index.html"; }

const API =
"https://letbackend.onrender.com/api/videos";

async function loadVideos(){

    try{

        const response =
        await fetch(API);

        const data =
        await response.json();

        const grid =
        document.getElementById(
            "videoGrid"
        );

        grid.innerHTML = "";

        data.videos.forEach(video=>{

            const card =
            document.createElement(
                "div"
            );

            card.className =
            "card";

            card.innerHTML = `

                <img
                class="thumbnail"
                src="${video.thumbnailUrl}"
                onerror="this.src='https://placehold.co/600x400?text=No+Thumbnail'">

                <div class="content">

                    <div class="title">
                        ${video.title}
                    </div>

                    <div class="cost">
                        ${video.tokenCost}
                        Tokens
                    </div>

                </div>

            `;

            card.onclick = ()=>{

                playVideo(
                    video.id
                );

            };

            grid.appendChild(
                card
            );

        });

    }catch(err){

        console.error(err);

        document.getElementById(
            "videoGrid"
        ).innerHTML =
        "<div class='loading'>Failed to load videos.</div>";

    }

}

async function playVideo(id){

    try{

        document.getElementById(
            "message"
        ).innerHTML = "";

        const response =
        await fetch(
            `${API}/watch/${id}`,
            {
                headers:{
                    Authorization:
                    `Bearer ${
                        localStorage.getItem(
                            "token"
                        )
                    }`
                }
            }
        );

        const data =
        await response.json();
            console.log(data);
console.log(data.videoUrl);
        if(!response.ok){

            document.getElementById(
                "message"
            ).innerHTML =
            data.message ||
            "Unable to play video.";

            return;
        }

        const player =
        document.getElementById(
            "player"
        );

        player.src =
        data.videoUrl;

        document
        .getElementById(
            "videoModal"
        )
        .style.display =
        "flex";

        player.play();

    }catch(err){

        console.error(err);

        document.getElementById(
            "message"
        ).innerHTML =
        "Error loading video.";

    }

}

function closePlayer(){

    const player =
    document.getElementById(
        "player"
    );

    player.pause();

    player.removeAttribute(
        "src"
    );

    player.load();

    document
    .getElementById(
        "videoModal"
    )
    .style.display =
    "none";

}

document
.getElementById(
    "videoModal"
)
.addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            closePlayer();

        }

    }
);

document
.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Escape"
        ){

            closePlayer();

        }

    }
);

loadVideos();

</script>

</body>
</html>
