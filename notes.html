<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Notes Gallery</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:
    radial-gradient(
        circle at top,
        #1e293b,
        #0f172a 70%
    );

    min-height:100vh;

    padding:30px;

    color:white;

}

.container{

    max-width:1400px;

    margin:auto;

}

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;

}

.title{

    font-size:34px;

    font-weight:700;

}

.subtitle{

    color:#94a3b8;

    margin-top:5px;

}

.add-btn{

    border:none;

    padding:14px 20px;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-weight:600;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

}

.search-box{

    width:100%;

    padding:15px;

    border:none;

    outline:none;

    border-radius:16px;

    margin-bottom:25px;

    background:
    rgba(255,255,255,.05);

    border:1px solid
    rgba(255,255,255,.08);

    color:white;

}

.search-box::placeholder{

    color:#94a3b8;

}

.notes-grid{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fill,
        minmax(280px,1fr)
    );

    gap:25px;

}

.note-card{

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(12px);

    border:1px solid
    rgba(255,255,255,.08);

    border-radius:24px;

    overflow:hidden;

    cursor:pointer;

    transition:.3s;

}

.note-card:hover{

    transform:
    translateY(-6px);

    border-color:#3b82f6;

}

.note-card img{

    width:100%;

    height:220px;

    object-fit:cover;

    display:block;

}

.note-content{

    padding:18px;

}

.note-title{

    font-size:18px;

    font-weight:600;

    margin-bottom:8px;

}

.note-subject{

    color:#94a3b8;

    font-size:14px;

}

/* Modal */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.85);

    z-index:1000;

    justify-content:center;

    align-items:center;

    padding:20px;

}

.modal-content{

    max-width:90%;

    max-height:90%;

}

.modal-content img{

    width:100%;

    max-height:85vh;

    object-fit:contain;

    border-radius:20px;

}

.close{

    position:absolute;

    top:20px;

    right:25px;

    font-size:40px;

    cursor:pointer;

    color:white;

}

.loading{

    text-align:center;

    font-size:22px;

    color:#94a3b8;

    margin-top:100px;

}

@media(max-width:768px){

    body{

        padding:15px;

    }

    .header{

        flex-direction:column;

        gap:15px;

        text-align:center;

    }

    .title{

        font-size:28px;

    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <div>

            <h1 class="title">
                📚 Study Notes
            </h1>

            <p class="subtitle">
                Handwritten Notes & Important Formulas
            </p>

        </div>

        <button class="add-btn">
            + Upload Note
        </button>

    </div>

    <input
    type="text"
    class="search-box"
    id="searchInput"
    placeholder="Search notes...">

    <div
    class="notes-grid"
    id="notesGrid">

    </div>

</div>

<!-- Image Modal -->

<div
class="modal"
id="imageModal">

    <span
    class="close"
    onclick="closeModal()">

    &times;

    </span>

    <div class="modal-content">

        <img
        id="modalImage"
        src="">

    </div>

</div>

<script>

const notes = [

{
    id:1,
    title:"Semiconductor Basics",
    subject:"Electronics",
    image:"https://picsum.photos/600/400?1"
},

{
    id:2,
    title:"Power System Formula",
    subject:"Electrical",
    image:"https://picsum.photos/600/400?2"
},

{
    id:3,
    title:"Engineering Mechanics",
    subject:"Mechanics",
    image:"https://picsum.photos/600/400?3"
},

{
    id:4,
    title:"Thermodynamics Notes",
    subject:"Mechanical",
    image:"https://picsum.photos/600/400?4"
},

{
    id:5,
    title:"Differential Equations",
    subject:"Mathematics",
    image:"https://picsum.photos/600/400?5"
},

{
    id:6,
    title:"Programming Cheat Sheet",
    subject:"Programming",
    image:"https://picsum.photos/600/400?6"
}

];

function renderNotes(data){

    const grid =
    document.getElementById(
        "notesGrid"
    );

    grid.innerHTML = "";

    data.forEach(note=>{

        grid.innerHTML += `

        <div
            class="note-card"
            onclick="openNote('${note.image}')">

            <img
            src="${note.image}"
            alt="${note.title}">

            <div class="note-content">

                <div class="note-title">

                    ${note.title}

                </div>

                <div class="note-subject">

                    ${note.subject}

                </div>

            </div>

        </div>

        `;

    });

}

function openNote(image){

    document
    .getElementById(
        "modalImage"
    )
    .src = image;

    document
    .getElementById(
        "imageModal"
    )
    .style.display =
    "flex";

}

function closeModal(){

    document
    .getElementById(
        "imageModal"
    )
    .style.display =
    "none";

}

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    function(){

        const term =
        this.value
        .toLowerCase();

        const filtered =
        notes.filter(note=>

            note.title
            .toLowerCase()
            .includes(term)

            ||

            note.subject
            .toLowerCase()
            .includes(term)

        );

        renderNotes(
            filtered
        );

    }
);

window.onclick =
function(event){

    const modal =
    document.getElementById(
        "imageModal"
    );

    if(
        event.target === modal
    ){

        closeModal();

    }

};

renderNotes(notes);

</script>

</body>
</html>
