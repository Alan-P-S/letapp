<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz App Auth</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    radial-gradient(
        circle at top,
        #1e293b,
        #0f172a 70%
    );
}

.container{
    width:100%;
    max-width:450px;

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(15px);

    border:1px solid
    rgba(255,255,255,.08);

    padding:35px;
    border-radius:28px;
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:700;
    color:white;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.tabs button{
    flex:1;

    border:none;

    padding:14px;

    cursor:pointer;

    border-radius:14px;

    background:
    rgba(255,255,255,.05);

    color:#cbd5e1;

    font-weight:600;

    transition:.25s;
}

.tabs button.active{

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

input{
    width:100%;

    padding:15px;

    margin-bottom:15px;

    border-radius:14px;

    border:1px solid
    rgba(255,255,255,.08);

    background:
    rgba(255,255,255,.04);

    color:white;

    outline:none;
}

input::placeholder{
    color:#94a3b8;
}

input:focus{
    border-color:#3b82f6;
}

.submit-btn{

    width:100%;

    border:none;

    padding:15px;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
        );

    color:white;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    transition:.25s;
}

.submit-btn:hover{
    transform:translateY(-2px);
}

.message{

    margin-top:18px;

    text-align:center;

    color:#cbd5e1;

    font-size:14px;
}

.motivation{

    margin-top:25px;

    text-align:center;

    color:#94a3b8;

    font-size:13px;

    line-height:1.7;
}

@media(max-width:500px){

    .container{
        padding:25px;
    }

    .logo{
        font-size:28px;
    }

} 

</style>
</head>
<body>

<div class="container">

<div class="logo">
Quiz App 3.0
</div>

<div class="tabs">
<button id="loginTab" class="active">Login</button>
<button id="signupTab">Sign Up</button>
</div>

<form id="loginForm" class="form active">

<input
type="email"
id="loginEmail"
placeholder="Email"
required>

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<button class="submit-btn">
Login
</button>

</form>

<form id="signupForm" class="form">

<input
type="text"
id="signupUsername"
placeholder="Username"
required>

<input
type="email"
id="signupEmail"
placeholder="Email"
required>

<input
type="password"
id="signupPassword"
placeholder="Password"
required>

<button class="submit-btn">
Create Account
</button>

</form>

<div class="message" id="message"></div>

</div>

<script>

const API_URL = "https://letbackend.onrender.com/api";

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

const message = document.getElementById("message");


// Check token on page load
const token = localStorage.getItem("token");

if(token){
    window.location.href = "home.html";
}


// Switch Forms
loginTab.onclick = () => {

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    loginForm.classList.add("active");
    signupForm.classList.remove("active");

};

signupTab.onclick = () => {

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    signupForm.classList.add("active");
    loginForm.classList.remove("active");

};


// Login
loginForm.addEventListener("submit", async(e)=>{

    e.preventDefault();

    try{

        const res = await fetch(
            API_URL + "/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    email:loginEmail.value,
                    password:loginPassword.value
                })
            }
        );

        const data = await res.json();

        if(data.token){

            localStorage.setItem(
                "token",
                data.token
            );

            window.location.href =
            "home.html";

        }else{

            message.innerText =
            data.message || "Login Failed";

        }

    }catch(err){

        message.innerText =
        "Server Error";

    }

});


// Signup
signupForm.addEventListener("submit", async(e)=>{

    e.preventDefault();

    try{

        const res = await fetch(
            API_URL + "/signup",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username:signupUsername.value,
                    email:signupEmail.value,
                    password:signupPassword.value
                })
            }
        );

        const data = await res.json();

        if(data.token){

            localStorage.setItem(
                "token",
                data.token
            );

            window.location.href =
            "home.html";

        }else{

            message.innerText =
            data.message || "Signup Failed";

        }

    }catch(err){

        message.innerText =
        "Server Error";

    }

});

</script>

</body>
</html>
