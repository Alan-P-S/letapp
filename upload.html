<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Note</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:
    radial-gradient(
        circle at top,
        #1e293b,
        #0f172a 70%
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

}

.container{

    width:100%;
    max-width:700px;

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(12px);

    border:1px solid
    rgba(255,255,255,.08);

    border-radius:24px;

    padding:30px;

    color:white;

}

.title{

    font-size:30px;

    font-weight:700;

    margin-bottom:8px;

}

.subtitle{

    color:#94a3b8;

    margin-bottom:25px;

}

.form-group{

    margin-bottom:18px;

}

label{

    display:block;

    margin-bottom:8px;

    color:#cbd5e1;

}

input,
select,
textarea{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:14px;

    background:
    rgba(255,255,255,.05);

    border:1px solid
    rgba(255,255,255,.08);

    color:white;

}

textarea{

    resize:vertical;

}

input[type="file"]{

    padding:10px;

}

.preview{

    margin-top:20px;

    display:none;

    text-align:center;

}

.preview img{

    width:100%;

    max-height:350px;

    object-fit:contain;

    border-radius:16px;

}

.upload-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:600;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

}

.upload-btn:hover{

    opacity:.9;

}

.status{

    margin-top:15px;

    text-align:center;

    color:#22c55e;

}

</style>
</head>
<body>

<div class="container">

    <h1 class="title">
        📚 Upload Study Note
    </h1>

    <p class="subtitle">
        Share notes with other CET aspirants.
    </p>

    <div class="form-group">

        <label>
            Note Title
        </label>

        <input
        type="text"
        id="title"
        placeholder="Semiconductor Basics">

    </div>

    <div class="form-group">

        <label>
            Subject
        </label>

        <select id="subject">

            <option>Electrical</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>Mathematics</option>
            <option>Mechanics</option>
            <option>Programming</option>

        </select>

    </div>

    <div class="form-group">

        <label>
            Description
        </label>

        <textarea
        id="description"
        rows="4"
        placeholder="Short description...">
        </textarea>

    </div>

    <div class="form-group">

        <label>
            Upload Image
        </label>

        <input
        type="file"
        id="image"
        accept="image/*">

    </div>

    <div
    class="preview"
    id="preview">

        <img
        id="previewImage">

    </div>

    <button
    class="upload-btn"
    onclick="uploadNote()">

        🚀 Upload Note

    </button>

    <div
    class="status"
    id="status">

    </div>

</div>

<script>

const imageInput =
document.getElementById(
    "image"
);

imageInput.addEventListener(
    "change",
    e=>{

        const file =
        e.target.files[0];

        if(!file) return;

        const reader =
        new FileReader();

        reader.onload =
        function(){

            document
            .getElementById(
                "previewImage"
            )
            .src =
            reader.result;

            document
            .getElementById(
                "preview"
            )
            .style.display =
            "block";

        };

        reader.readAsDataURL(
            file
        );

    }
);

async function uploadNote(){

    const title =
    document.getElementById(
        "title"
    ).value;

    const subject =
    document.getElementById(
        "subject"
    ).value;

    const description =
    document.getElementById(
        "description"
    ).value;

    const image =
    document.getElementById(
        "image"
    ).files[0];

    if(
        !title ||
        !image
    ){

        alert(
            "Title and Image are required"
        );

        return;

    }

    document
    .getElementById(
        "status"
    )
    .innerText =
    "Uploading...";

    // Dummy Upload

    await new Promise(
        resolve=>
        setTimeout(
            resolve,
            1500
        )
    );

    document
    .getElementById(
        "status"
    )
    .innerText =
    "✅ Note uploaded successfully";

}

</script>

</body>
</html>
