<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Study Session</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background: #f4f6fb;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* Card */

.study-form-card {

    width: 100%;
    max-width: 500px;

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
}


/* Header */

.header {
    margin-bottom: 25px;
}

.header h1 {
    font-size: 25px;

    color: #20232a;

    margin-bottom: 6px;
}

.header p {
    color: #777;

    font-size: 14px;
}


/* Form */

.form-group {
    display: flex;

    flex-direction: column;

    margin-bottom: 18px;
}

.form-group label {
    font-size: 14px;

    font-weight: 600;

    color: #444;

    margin-bottom: 7px;
}


/* Inputs */

input,
select,
textarea {

    width: 100%;

    padding: 12px 14px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 14px;

    outline: none;

    background: white;

    transition: 0.2s;
}

input:focus,
select:focus,
textarea:focus {

    border-color: #6366f1;

    box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.1);
}


textarea {
    resize: vertical;
}


/* Hours + minutes */

.time-row {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}


/* Submit button */

button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: #6366f1;

    color: white;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #4f46e5;
}

button:disabled {

    opacity: 0.6;

    cursor: not-allowed;
}


/* Status */

.status {

    margin-top: 15px;

    text-align: center;

    font-size: 14px;
}

.status.success {
    color: #16a34a;
}

.status.error {
    color: #dc2626;
}


/* Mobile */

@media (max-width: 500px) {

    .study-form-card {
        padding: 22px;
    }

    .time-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

}
.time-slider {
    display: flex;
    align-items: center;
    gap: 15px;
}

.time-slider input[type="range"] {
    flex: 1;

    appearance: none;

    height: 6px;

    padding: 0;

    border: none;

    border-radius: 10px;

    background: #ddd;

    cursor: pointer;
}

/* Slider knob */

.time-slider input[type="range"]::-webkit-slider-thumb {
    appearance: none;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: #6366f1;

    cursor: pointer;

    border: 3px solid white;

    box-shadow: 0 0 0 2px #6366f1;
}

.time-slider input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #6366f1;

    cursor: pointer;

    border: 3px solid white;
}

.time-display {
    min-width: 70px;

    text-align: center;

    padding: 8px 10px;

    background: #f1f3f7;

    border-radius: 8px;

    font-weight: 600;

    color: #333;
}
</style>    
</head>

<body>

    <div class="study-form-card">

        <div class="header">
            <h1>Add Study Session</h1>
            <p>Record the time you spent studying</p>
        </div>

        <form id="studyForm">

            <!-- Subject -->
            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <select id="subject" required>

                    <option value="">
                        Select subject
                    </option>

                    <option value="Mathematics">
                        Mathematics
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Electrical">
                        Electrical
                    </option>

                    <option value="Mechanical">
                        Mechanical
                    </option>

                    <option value="Civil">
                        Civil
                    </option>

                    <option value="Programming">
                        Programming
                    </option>

                </select>

            </div>


            <!-- Date -->
            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >

            </div>


            <!-- Study time -->
           <div class="form-group">

    <label for="studyTime">
        Study Time
    </label>

    <div class="time-slider">

        <input
            type="range"
            id="studyTime"
            min="0"
            max="240"
            step="5"
            value="0"
        >

        <div class="time-display">
            <span id="studyTimeValue">0h 0m</span>
        </div>

    </div>

</div>


            <!-- Description -->
            <div class="form-group">

                <label for="description">
                    What did you study?
                </label>

                <textarea
                    id="description"
                    rows="4"
                    placeholder="Example: Solved differential equations..."
                ></textarea>

            </div>


            <!-- Submit -->
            <button
                type="submit"
                id="submitButton"
            >
                Add Study Session
            </button>


            <!-- Status -->
            <div
                id="status"
                class="status"
            ></div>

        </form>

    </div>


    <script >const API_URL = "https://letbackend.onrender.com/api/accademic/study-section";


const form =
    document.getElementById("studyForm");

const submitButton =
    document.getElementById("submitButton");

const status =
    document.getElementById("status");


    const studyTimeSlider =
    document.getElementById("studyTime");

const studyTimeValue =
    document.getElementById("studyTimeValue");


studyTimeSlider.addEventListener("input", () => {

    const totalMinutes =
        Number(studyTimeSlider.value);

    const hours =
        Math.floor(totalMinutes / 60);

    const minutes =
        totalMinutes % 60;

    studyTimeValue.textContent =
        `${hours}h ${minutes}m`;

});

form.addEventListener("submit", async (event) => {

    event.preventDefault();


    // Get values

    const subject =
        document.getElementById("subject").value;

    const date =
        document.getElementById("date").value;

   const totalMinutes =
    Number(document.getElementById("studyTime").value);

const durationSeconds = totalMinutes * 60;
    const description =
        document.getElementById("description").value;


    // Validate time

    // if (hours === 0 && minutes === 0) {

    //     showStatus(
    //         "Please enter some study time.",
    //         "error"
    //     );

    //     return;
    // }


    /*
        Convert everything to seconds.

        Example:

        2 hours 30 minutes

        = 9000 seconds
    */

    /*
        JSON sent to backend
    */

    const data = {

        subject: subject,

        date: date,

        durationSeconds: durationSeconds,

        description: description

    };


    try {

        submitButton.disabled = true;

        submitButton.textContent =
            "Saving...";


        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify(data)

            });


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to save study session"
            );

        }


        showStatus(
            "Study session added successfully!",
            "success"
        );


        form.reset();


    } catch (error) {

        console.error(error);

        showStatus(
            error.message,
            "error"
        );

    } finally {

        submitButton.disabled = false;

        submitButton.textContent =
            "Add Study Session";

    }

});


function showStatus(message, type) {

    status.textContent = message;

    status.className =
        `status ${type}`;

}</script>

</body>
</html>
