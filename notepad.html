
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Study Note Creator</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(
        circle at top,
        #1e293b,
        #0f172a 70%
    );

    min-height:100vh;

    padding:25px;

    color:white;

}

.container{

    max-width:1400px;

    margin:auto;

}

.header{

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(12px);

    border:1px solid
    rgba(255,255,255,.08);

    border-radius:24px;

    padding:25px;

    margin-bottom:25px;

}

.header h1{

    font-size:32px;

}

.header p{

    color:#94a3b8;

    margin-top:8px;

}

.meta{

    display:grid;

    grid-template-columns:
    2fr 1fr;

    gap:20px;

    margin-top:20px;

}

input,
select{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:
    rgba(255,255,255,.05);

    border:1px solid
    rgba(255,255,255,.08);

    color:white;

}

.workspace{

    display:grid;

    grid-template-columns:
    1.2fr 1fr;

    gap:25px;

}

.left-panel,
.right-panel{

    display:flex;

    flex-direction:column;

    gap:25px;

}

.card{

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(12px);

    border:1px solid
    rgba(255,255,255,.08);

    border-radius:24px;

    padding:20px;

}

.card h2{

    margin-bottom:15px;

}

.note-editor{

    width:100%;

    min-height:500px;

    border:none;

    outline:none;

    resize:none;

    background:#fffef5;

    color:#111827;

    border-radius:18px;

    padding:30px;

    font-family:'Caveat',cursive;

    font-size:32px;

    line-height:1.5;

}

.canvas-toolbar{

    display:flex;

    gap:10px;

    margin-bottom:15px;

}

.canvas-toolbar button{

    border:none;

    padding:10px 15px;

    border-radius:10px;

    cursor:pointer;

    background:#2563eb;

    color:white;

}

.canvas-toolbar input[type=color]{

    height:42px;

    border:none;

}

#drawingCanvas{

    width:100%;

    height:450px;

    background:white;

    border-radius:18px;

    cursor:crosshair;

}

.upload-box{

    border:2px dashed
    rgba(255,255,255,.15);

    border-radius:18px;

    padding:25px;

    text-align:center;

}

.upload-box input{

    margin-top:15px;

}

.image-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(120px,1fr));

    gap:12px;

    margin-top:20px;

}

.image-grid img{

    width:100%;

    height:120px;

    object-fit:cover;

    border-radius:14px;

}

.save-btn{

    width:100%;

    margin-top:25px;

    border:none;

    padding:16px;

    border-radius:16px;

    cursor:pointer;

    font-size:16px;

    font-weight:600;

    color:white;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

}

@media(max-width:1000px){

    .workspace{

        grid-template-columns:1fr;

    }

}

</style>
</head>
<body>

<div class="container">

<div class="header">

    <h1>📚 Create Study Note</h1>

    <p>
        Write notes, draw diagrams, and upload images.
    </p>

    <div class="meta">

        <input
        id="title"
        placeholder="Note Title">

        <select id="subject">

            <option>Electrical</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>Mathematics</option>
            <option>Mechanics</option>
            <option>Programming</option>

        </select>

    </div>

</div>

<div class="workspace">

    <div class="left-panel">

        <div class="card">

            <h2>📝 Written Notes</h2>

            <textarea
            id="content"
            class="note-editor"
            placeholder="Start writing your notes..."></textarea>

        </div>

    </div>

    <div class="right-panel">

        <div class="card">

            <h2>🎨 Drawing Board</h2>

            <div class="canvas-toolbar">

                <button onclick="clearCanvas()">
                    Clear
                </button>

                <input
                type="color"
                id="colorPicker"
                value="#000000">

            </div>

            <canvas
            id="drawingCanvas">
            </canvas>

        </div>

        <div class="card">

            <h2>📷 Reference Images</h2>

            <div class="upload-box">

                Upload diagrams,
                screenshots or formulas.

                <input
                type="file"
                id="imageUpload"
                multiple
                accept="image/*">

            </div>

            <div
            class="image-grid"
            id="imageGrid">
            </div>

        </div>

    </div>

</div>

<button
class="save-btn"
onclick="saveNote()">

💾 Save Complete Note

</button>

</div>

<script>

const canvas =
document.getElementById(
    "drawingCanvas"
);

const ctx =
canvas.getContext("2d");

canvas.width = 600;
canvas.height = 450;

let drawing = false;

canvas.addEventListener(
    "mousedown",
    e=>{

        drawing = true;

        ctx.beginPath();

        ctx.moveTo(
            e.offsetX,
            e.offsetY
        );

    }
);

canvas.addEventListener(
    "mousemove",
    e=>{

        if(!drawing) return;

        ctx.strokeStyle =
        document.getElementById(
            "colorPicker"
        ).value;

        ctx.lineWidth = 3;

        ctx.lineCap = "round";

        ctx.lineTo(
            e.offsetX,
            e.offsetY
        );

        ctx.stroke();

    }
);

canvas.addEventListener(
    "mouseup",
    ()=>drawing=false
);

function clearCanvas(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}

const uploadedImages = [];

document
.getElementById(
    "imageUpload"
)
.addEventListener(
    "change",
    function(){

        const files =
        [...this.files];

        const grid =
        document.getElementById(
            "imageGrid"
        );

        files.forEach(file=>{

            const reader =
            new FileReader();

            reader.onload =
            e=>{

                uploadedImages.push(
                    e.target.result
                );

                grid.innerHTML +=
                `<img src="${e.target.result}">`;

            };

            reader.readAsDataURL(
                file
            );

        });

    }
);

function saveNote(){

    const payload = {

        title:
        document.getElementById(
            "title"
        ).value,

        subject:
        document.getElementById(
            "subject"
        ).value,

        content:
        document.getElementById(
            "content"
        ).value,

        drawing:
        canvas.toDataURL(),

        images:
        uploadedImages

    };

    console.log(payload);

    alert(
        "Ready to send to backend 🚀"
    );

}

</script>

</body>
</html>
