<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Notification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Schedule Notification</h1>

    <form id="notificationForm">

      <div class="form-group">
        <label for="subject">Subject</label>
        <input
          type="text"
          id="subject"
          value=""
          placeholder="Enter the subject here"
          required
        />
      </div>

      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          value=""
          placeholder="Enter the title here"
          required
        />
      </div>

      <div class="form-group">
        <label for="body">Message</label>
        <textarea id="body" required placeholder="Enter the message here"></textarea>
      </div>

      <div class="form-group">
        <label for="dateTime">Date & Time</label>
        <input
          type="datetime-local"
          id="dateTime"
          required
        />
      </div>

      <button type="submit" id="submitButton">
        Schedule Notification
      </button>

    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById("notificationForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    const API_URL =
      "https://letbackend.onrender.com/api/subscribe/schedule-notification";

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const subject = document.getElementById("subject").value;
      const title = document.getElementById("title").value;
      const body = document.getElementById("body").value;
      const dateTime = document.getElementById("dateTime").value;

      // Convert datetime-local to ISO 8601
      const isoDateTime = new Date(dateTime).toISOString();

      const data = {
        subject: subject,
        title: title,
        body: body,
        DateTime: isoDateTime
      };

      button.disabled = true;
      button.textContent = "Scheduling...";
      status.className = "";
      status.style.display = "none";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message || `Request failed (${response.status})`
          );
        }

        status.textContent =
          result.message || "Notification scheduled successfully!";

        status.className = "success";

        console.log("Server response:", result);
        console.log("Sent data:", data);

      } catch (error) {
        console.error("Error:", error);

        status.textContent =
          "Failed to schedule notification: " + error.message;

        status.className = "error";

      } finally {
        button.disabled = false;
        button.textContent = "Schedule Notification";
      }
    });
  </script>

</body>
</html>
