<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Add Clothing | Virtual Wardrobe</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #292354,
            #111321 45%,
            #090b12
        );

    color: white;

    padding: 20px;

}


.container {

    width: 100%;

    max-width: 550px;

    margin: 30px auto;

}


/* ==============================
   HEADER
============================== */

.header {

    display: flex;

    align-items: center;

    gap: 14px;

    margin-bottom: 22px;

}


.icon {

    width: 55px;

    height: 55px;

    border-radius: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    box-shadow:
        0 0 25px
        rgba(124,58,237,.4);

}


.header h1 {

    font-size: 25px;

}


.header p {

    color: #969bad;

    font-size: 13px;

    margin-top: 3px;

}


/* ==============================
   CARD
============================== */

.card {

    background:
        linear-gradient(
            145deg,
            rgba(35,38,58,.96),
            rgba(18,20,31,.96)
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 20px;

    padding: 24px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.3);

}


/* ==============================
   FORM
============================== */

.field {

    margin-bottom: 20px;

}


label {

    display: block;

    font-size: 13px;

    color: #b7bbca;

    margin-bottom: 8px;

}


input,
select {

    width: 100%;

    padding: 14px;

    border-radius: 11px;

    border:
        1px solid
        #303448;

    background:
        #10121b;

    color: white;

    font-size: 15px;

    outline: none;

}


input:focus,
select:focus {

    border-color:
        #818cf8;

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.12);

}


select {

    cursor: pointer;

}


option {

    background: #181b29;

}


/* ==============================
   PRICE
============================== */

.price-wrapper {

    position: relative;

}


.currency {

    position: absolute;

    left: 14px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #facc15;

    font-weight: bold;

}


.price-wrapper input {

    padding-left: 35px;

}


/* ==============================
   STATUS
============================== */

.status-options {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

}


.status-option {

    position: relative;

}


.status-option input {

    position: absolute;

    opacity: 0;

}


.status-label {

    display: block;

    padding: 13px;

    text-align: center;

    border-radius: 11px;

    border:
        1px solid
        #303448;

    background:
        #10121b;

    color: #999eaf;

    cursor: pointer;

    transition: .2s;

}


.status-option
input:checked
+ .status-label {

    border-color:
        #6366f1;

    background:
        rgba(99,102,241,.15);

    color: white;

}


/* ==============================
   PREVIEW
============================== */

.preview {

    margin-top: 25px;

    padding: 18px;

    border-radius: 15px;

    background:
        #10121b;

    border:
        1px solid
        rgba(255,255,255,.06);

}


.preview-title {

    color: #85899b;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 12px;

}


.preview-item {

    display: flex;

    align-items: center;

    gap: 14px;

}


.preview-icon {

    width: 65px;

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 12px;

    background:
        radial-gradient(
            circle,
            #363b59,
            #191c2b
        );

    font-size: 35px;

}


.preview-info {

    flex: 1;

}


.preview-name {

    font-weight: bold;

    font-size: 16px;

}


.preview-type {

    color: #818cf8;

    font-size: 11px;

    margin-top: 3px;

}


.preview-price {

    color: #facc15;

    font-weight: bold;

    margin-top: 5px;

}


/* ==============================
   BUTTON
============================== */

button {

    width: 100%;

    border: none;

    padding: 15px;

    margin-top: 20px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6366f1
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(99,102,241,.25);

}


button:hover {

    filter: brightness(1.1);

}


button:disabled {

    opacity: .5;

    cursor: not-allowed;

}


/* ==============================
   MESSAGE
============================== */

.message {

    margin-top: 15px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    font-size: 13px;

    display: none;

}


.success {

    display: block;

    background:
        rgba(34,197,94,.12);

    color:
        #4ade80;

    border:
        1px solid
        rgba(34,197,94,.2);

}


.error {

    display: block;

    background:
        rgba(239,68,68,.12);

    color:
        #f87171;

    border:
        1px solid
        rgba(239,68,68,.2);

}


/* ==============================
   JSON
============================== */

.json-preview {

    margin-top: 20px;

}


.json-preview summary {

    color: #85899b;

    cursor: pointer;

    font-size: 12px;

}


pre {

    margin-top: 10px;

    padding: 12px;

    border-radius: 10px;

    background: #090b11;

    color: #c4b5fd;

    font-size: 12px;

    overflow-x: auto;

}


/* ==============================
   MOBILE
============================== */

@media(max-width:600px) {

    body {

        padding: 12px;

    }

    .container {

        margin: 15px auto;

    }

    .card {

        padding: 18px;

    }

    .header h1 {

        font-size: 21px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="icon">
            👕
        </div>

        <div>

            <h1>
                Add Clothing
            </h1>

            <p>
                Add a new item to your wardrobe
            </p>

        </div>

    </div>


    <!-- FORM -->

    <div class="card">


        <!-- NAME -->

        <div class="field">

            <label>
                Clothing Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Example: Black Hoodie"
            >

        </div>


        <!-- TYPE -->

        <div class="field">

            <label>
                Clothing Type
            </label>

            <select id="type">

                <option value="">
                    Select type
                </option>

                <option value="TOP">
                    👕 Top
                </option>

                <option value="BOTTOM">
                    👖 Bottom
                </option>

                <option value="JACKET">
                    🧥 Jacket
                </option>

                <option value="DRESS">
                    👗 Dress
                </option>

                <option value="SHOES">
                    👟 Shoes
                </option>

                <option value="HEAD">
                    🧢 Headwear
                </option>

                <option value="ACCESSORY">
                    🕶️ Accessory
                </option>

            </select>

        </div>


        <!-- PRICE -->

        <div class="field">

            <label>
                Price
            </label>

            <div class="price-wrapper">

                <span class="currency">
                    ₹
                </span>

                <input
                    type="number"
                    id="price"
                    min="0"
                    placeholder="1200"
                >

            </div>

        </div>


        <!-- STATUS -->

        <div class="field">

            <label>
                Status
            </label>


            <div class="status-options">


                <div class="status-option">

                    <input
                        type="radio"
                        name="status"
                        id="unworn"
                        value="UN WORN"
                        checked
                    >

                    <label
                        for="unworn"
                        class="status-label"
                    >
                        ⚪ UN WORN
                    </label>

                </div>


                <div class="status-option">

                    <input
                        type="radio"
                        name="status"
                        id="wearing"
                        value="WEARING"
                    >

                    <label
                        for="wearing"
                        class="status-label"
                    >
                        🟢 WEARING
                    </label>

                </div>


            </div>

        </div>


        <!-- PREVIEW -->

        <div class="preview">

            <div class="preview-title">
                Inventory Preview
            </div>


            <div class="preview-item">

                <div
                    class="preview-icon"
                    id="previewIcon"
                >
                    🎽
                </div>


                <div class="preview-info">

                    <div
                        class="preview-name"
                        id="previewName"
                    >
                        New Clothing
                    </div>


                    <div
                        class="preview-type"
                        id="previewType"
                    >
                        ITEM
                    </div>


                    <div
                        class="preview-price"
                        id="previewPrice"
                    >
                        🪙 ₹0
                    </div>

                </div>

            </div>

        </div>


        <!-- SUBMIT -->

        <button
            id="submitButton"
            onclick="addClothing()"
        >
            ⚔️ Add to Wardrobe
        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- JSON -->

        <details class="json-preview">

            <summary>
                View JSON
            </summary>

            <pre id="jsonPreview"></pre>

        </details>


    </div>


</div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
    "https://letbackend.onrender.com/api/wardobe/clothing-item";


/* =====================================================
   ELEMENTS
===================================================== */

const nameInput =
    document.getElementById("name");

const typeInput =
    document.getElementById("type");

const priceInput =
    document.getElementById("price");

const previewName =
    document.getElementById(
        "previewName"
    );

const previewType =
    document.getElementById(
        "previewType"
    );

const previewPrice =
    document.getElementById(
        "previewPrice"
    );

const previewIcon =
    document.getElementById(
        "previewIcon"
    );

const jsonPreview =
    document.getElementById(
        "jsonPreview"
    );

const message =
    document.getElementById(
        "message"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );


/* =====================================================
   TYPE ICONS
===================================================== */

const TYPE_ICONS = {

    TOP: "👕",

    BOTTOM: "👖",

    JACKET: "🧥",

    DRESS: "👗",

    SHOES: "👟",

    HEAD: "🧢",

    ACCESSORY: "🕶️"

};


/* =====================================================
   GET STATUS
===================================================== */

function getStatus() {

    const selected =
        document.querySelector(
            'input[name="status"]:checked'
        );

    return selected
        ? selected.value
        : "UN WORN";

}


/* =====================================================
   GET FORM DATA
===================================================== */

function getFormData() {

    return {

        name:
            nameInput.value.trim(),

        type:
            typeInput.value,

        price:
            Number(
                priceInput.value || 0
            ),

        status:
            getStatus()

    };

}


/* =====================================================
   UPDATE PREVIEW
===================================================== */

function updatePreview() {

    const data =
        getFormData();


    previewName.textContent =
        data.name ||
        "New Clothing";


    previewType.textContent =
        data.type ||
        "ITEM";


    previewPrice.textContent =
        "🪙 ₹" +
        data.price.toLocaleString(
            "en-IN"
        );


    previewIcon.textContent =
        TYPE_ICONS[
            data.type
        ] || "🎽";


    jsonPreview.textContent =
        JSON.stringify(
            data,
            null,
            4
        );

}


/* =====================================================
   INPUT EVENTS
===================================================== */

nameInput.addEventListener(
    "input",
    updatePreview
);


typeInput.addEventListener(
    "change",
    updatePreview
);


priceInput.addEventListener(
    "input",
    updatePreview
);


document
    .querySelectorAll(
        'input[name="status"]'
    )
    .forEach(
        input =>
            input.addEventListener(
                "change",
                updatePreview
            )
    );


/* =====================================================
   ADD CLOTHING
===================================================== */

async function addClothing() {

    const data =
        getFormData();


    /* ==========================
       VALIDATION
    ========================== */

    if (!data.name) {

        showMessage(
            "Please enter a clothing name.",
            "error"
        );

        return;

    }


    if (!data.type) {

        showMessage(
            "Please select a clothing type.",
            "error"
        );

        return;

    }


    if (
        data.price < 0 ||
        isNaN(data.price)
    ) {

        showMessage(
            "Please enter a valid price.",
            "error"
        );

        return;

    }


    try {

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Adding...";


        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            data
                        )

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                `Server returned ${response.status}`
            );

        }


        console.log(
            "API response:",
            result
        );


        showMessage(
            "🎉 Clothing added to your wardrobe!",
            "success"
        );


        /*
        Clear form
        */

        nameInput.value = "";

        typeInput.value = "";

        priceInput.value = "";

        document.getElementById(
            "unworn"
        ).checked = true;


        updatePreview();

    }


    catch (error) {

        console.error(error);


        showMessage(
            "❌ " + error.message,
            "error"
        );

    }


    finally {

        submitButton.disabled =
            false;

        submitButton.textContent =
            "⚔️ Add to Wardrobe";

    }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        `message ${type}`;

    message.style.display =
        "block";

}


/* =====================================================
   INITIAL PREVIEW
===================================================== */

updatePreview();

</script>

</body>

</html>
